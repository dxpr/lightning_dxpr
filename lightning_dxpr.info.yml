name: 'Lightning DXPR'
type: profile
description: 'A fast and feature-rich Drupal distribution with DXPR no-code page builder.'
core_version_requirement: '^10.6'

distribution:
  name: DXPR

install:
  # Core modules
  - autosave_form
  - block_content
  - breakpoint
  - config
  - conflict
  - contextual
  - datetime
  - dblog
  - editor
  - entity_block
  - field_ui
  - file
  - help
  - history
  - menu_link_content
  - menu_ui
  - node
  - options
  - page_cache
  - path
  - search
  - shortcut
  - taxonomy
  - text
  - toolbar
  - views
  - views_ui
  # Contrib modules (from lightning)
  - diff
  - image_widget_crop
  - metatag
  - moderation_sidebar
  - pathauto
  - redirect
  # Lightning submodules
  - lightning_core
  - lightning_media
  - lightning_workflow
  - lightning_page
  - lightning_roles
  - lightning_media_audio
  - lightning_media_bulk_upload
  - lightning_media_document
  - lightning_media_image
  - lightning_media_slideshow
  - lightning_media_video
  - lightning_scheduler
  # DXPR additions
  - field_group
  - dxpr_theme_helper
  - webform
  - webform_ui

themes:
  - bootstrap
  - bootstrap4
  - bootstrap5
  - claro
  - dxpr_theme

config_devel:
  install:
    - editor.editor.full_html
    - filter.format.full_html
    - system.performance
    - node.settings
    - system.theme
    - user.role.dxpr_builder
