<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            <div id="productCarousel" class="carousel slide" data-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="product-image1.jpg" class="d-block w-100" alt="Product Image 1">
                    </div>
                    <div class="carousel-item">
                        <img src="product-image2.jpg" class="d-block w-100" alt="Product Image 2">
                    </div>
                    <div class="carousel-item">
                        <img src="product-image3.jpg" class="d-block w-100" alt="Product Image 3">
                    </div>
                </div>
                <a class="carousel-control-prev" href="#productCarousel" role="button" data-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="sr-only">Previous</span>
                </a>
                <a class="carousel-control-next" href="#productCarousel" role="button" data-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="sr-only">Next</span>
                </a>
            </div>
        </div>
        <div class="col-md-6">
            <h2 class="product-title">Product Name</h2>
            <p class="product-price text-success">$99.99</p>
            <p class="product-description">This is a brief description of the product. It highlights key features and benefits that will attract potential buyers.</p>
            <div class="product-options">
                <h5>Choose Color:</h5>
                <div class="btn-group btn-group-toggle" data-toggle="buttons">
                    <label class="btn btn-secondary">
                        <input type="radio" name="colorOptions" id="colorRed" autocomplete="off"> Red
                    </label>
                    <label class="btn btn-secondary">
                        <input type="radio" name="colorOptions" id="colorBlue" autocomplete="off"> Blue
                    </label>
                    <label class="btn btn-secondary">
                        <input type="radio" name="colorOptions" id="colorGreen" autocomplete="off"> Green
                    </label>
                </div>
            </div>
            <div class="product-quantity mt-3">
                <h5>Quantity:</h5>
                <input type="number" class="form-control" value="1" min="1" max="10">
            </div>
            <div class="mt-4">
                <button class="btn btn-primary btn-lg">Add to Cart</button>
                <button class="btn btn-outline-secondary btn-lg">Buy Now</button>
            </div>
        </div>
    </div>
</div>
