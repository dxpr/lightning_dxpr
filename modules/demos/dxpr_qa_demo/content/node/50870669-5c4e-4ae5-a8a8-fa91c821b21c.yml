      value: '<div class="dxb-element dxb-section" style="" data-dxb-id="gbaj8gzcv5" data-dxb-pid="gbaj8gzcv5" id="gbaj8gzcv5" data-dxb="dxb_section"><div class="dxb-ctnr container" data-dxb-cnt="true"><div class="dxb-element dxb-text" style="" data-dxb-id="gb4vb8efcx" data-dxb-pid="gb4vb8efcx" id="gb4vb8efcx" data-dxb="dxb_text" data-dxb-cnt="true"><h2>Test instructions for <em>user templates:</em></h2><p><br></p><ul><li>Click the disk icon on the Well element in the left column</li><li>Enter a template name, for example "Test 1"</li></ul><p>A green message box confirming the template is saved should appear in the top right corner of your browser.</p><ul><li>Click the + icon in the right column</li><li>Click the "Saved templates" tab</li><li>Select the template you named in Step 2</li></ul><p>Check that the left and right column are identical.</p><p>Check that inline editing works right away on the text element in the right column.</p></div><div class="dxb-element dxb-row row dxb-row--sm" style="" data-dxb-id="gbg64878k6" data-dxb-pid="gbg64878k6" id="gbg64878k6" data-dxb="dxb_row" data-dxb-device="sm" data-dxb-cnt="true"><div class="dxb-element dxb-ctnr dxb-column col-sm-6" style="" data-dxb-id="gbmqkiuhye" data-dxb-pid="gbmqkiuhye" id="gbmqkiuhye" data-dxb="dxb_column" data-dxb-width="1/2" data-dxb-cnt="true"><div class="dxb-element dxb-well well" style="" data-dxb-id="gb425brjno" data-dxb-pid="gb425brjno" id="gb425brjno" data-dxb="dxb_well"><div class="dxb-ctnr" data-dxb-cnt="true"><div class="dxb-element dxb-text" style="" data-dxb-id="gbmzmalzk8" data-dxb-pid="gbmzmalzk8" id="gbmzmalzk8" data-dxb="dxb_text" data-dxb-cnt="true"><h2>Lorem ipsum.</h2><p>Consectetur adipisicing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. </p></div><div class="dxb-element dxb-row row dxb-row--sm" style="" data-dxb-id="gbt09ti6nr" data-dxb-pid="gbt09ti6nr" id="gbt09ti6nr" data-dxb="dxb_row" data-dxb-device="sm" data-dxb-cnt="true"><div class="dxb-element