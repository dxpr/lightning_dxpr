      value: '<div class="dxb-element dxb-row row dxb-row--sm" style="" data-dxb-id="gbeg3ega2h" data-dxb-pid="gb1bym2e7t" id="gb1bym2e7t" data-dxb="dxb_row" data-dxb-device="sm" data-dxb-cnt="true"><div class="dxb-element dxb-ctnr dxb-column col-sm-6" style="" data-dxb-id="gb1ejhej2h" data-dxb-pid="gbrkam19rk" id="gbrkam19rk" data-dxb="dxb_column" data-dxb-width="1/2" data-dxb-cnt="true"><div class="dxb-element dxb-text" style="" data-dxb-id="gbxth4pkon" data-dxb-pid="gbi8vza83k" id="gbi8vza83k" data-dxb="dxb_text" data-dxb-cnt="true"><h2>The <em>positioned layers</em>&nbsp;element is our freehand&nbsp;tool.</h2><p>It allows for freehand positioning of any element you put inside. In this example, the layers are icon elements, that could be used to link to different pages. Most sites will not need an advanced layout tool like this, but it''s good to know it''s there when you needed it.</p></div></div><div class="dxb-element dxb-ctnr dxb-column col-sm-6" style="" data-dxb-id="gb9wmgmxz1" data-dxb-pid="gbxemvjvkx" id="gbxemvjvkx" data-dxb="dxb_column" data-dxb-width=" 1/2" data-dxb-cnt="true"><div class="dxb-element dxb-layers" style="" data-dxb-id="gbpvj5228p" data-dxb-pid="gbkstapviv" id="gbkstapviv" data-dxb="dxb_layers" data-dxb-width="84.07079646017698%" data-dxb-height="403" data-dxb-o_width="565"><div id="gbpvj5228p" class="dxb-ctnr" data-dxb-cnt="true" style="width: 84.0708%; height: 403px;"><a href="#" class="dxb-element dxb-icon hover-style-gbtwi3hsav" target="_self" data-dxb-editor-libraries="icon_helpers font_awesome_5_pro" data-dxb-id="gbtwi3hsav" data-dxb-pid="gbf35lj4m3" id="gbf35lj4m3" data-dxb="dxb_icon" data-dxb-icon="fas fa-star" data-dxb-size="fa-3x" data-dxb-link="#" data-dxb-link_target="_self" data-dxb-style="color:gold;" data-dxb-hover_style="color:#ffffff !important;" data-dxb-pos_left="66.52631578947368%" data-dxb-pos_top="28.78411910669975%" data-dxb-pos_width="17.263157894736842%" data-dxb-pos_height="22.332506203473944%" style="z-index: 0;