      value: "<div class=\"dxb-element dxb-section\" style=\"\" data-dxb-editor-libraries=\"\" data-dxb-id=\"gbq6a7h9d7\" data-dxb-pid=\"gbn0px59zz\" id=\"gbn0px59zz\" data-dxb=\"dxb_section\"><div class=\"dxb-ctnr container\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-row row dxb-row--sm\" style=\"\" data-dxb-id=\"gbd1rqnqxt\" data-dxb-pid=\"gb2rap74oj\" id=\"gb2rap74oj\" data-dxb=\"dxb_row\" data-dxb-device=\"sm\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-ctnr dxb-column col-sm-6\" style=\"\" data-dxb-id=\"gb2yzvkvj9\" data-dxb-pid=\"gbbutcn7ye\" id=\"gbbutcn7ye\" data-dxb=\"dxb_column\" data-dxb-width=\"1/2\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gbuhk62bh3\" data-dxb-pid=\"gb1sz90a5q\" id=\"gb1sz90a5q\" data-dxb=\"dxb_text\" data-dxb-cnt=\"true\"><h2>History Feature</h2><ol><li>Make a least 10 edits in the column to the right. Include different elements.</li><li>Don't save the container</li><li>Click the calendar icon</li><li>Check that you see at least 10 saved history states. example:</li></ol></div><div class=\"dxb-element dxb-image text-center\" data-dxb-id=\"gb6mjtjhu6\" data-dxb-pid=\"gb6nggo1b8\" id=\"gb6nggo1b8\" data-dxb=\"dxb_image\" data-dxb-image=\"-base-url-/-files-directory-/2020-11/Screenshot%202020-11-09%20at%2012.08.02.jpg?fid=13\" data-dxb-width=\"50%\" data-dxb-height=\"\" data-dxb-el_class=\"text-center\" data-dxb-style=\"border-radius:17px;overflow: hidden;\" data-dxb-shadow=\"2\"><img class=\"dxb-image-content dxpr-shadow-2\" style=\"border-radius:17px;overflow: hidden;\n width: 50%;\" src=\"-base-url-/-files-directory-/2020-11/Screenshot%202020-11-09%20at%2012.08.02.jpg?fid=13\" alt=\"\" title=\"\"></div><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gbhdi4mj9y\" data-dxb-pid=\"gbdh1ywyaq\" id=\"gbdh1ywyaq\" data-dxb=\"dxb_text\" data-dxb-cnt=\"true\"><h2><br></h2><ol><li>Click some different history state items and check that the contents of this container are reflecting the correct state after clicking</li><li>​​​​​​​Click the left and right arrow icons. The &lt;-- left arrow should take you back in history (to the oldest state) and the --&gt; right arrow&nbsp;should take you forward towards the most recent history state</li><li>Click the check icon and check that this container is now reflecting this history state.</li></ol></div></div><div class=\"dxb-element dxb-ctnr dxb-column col-sm-6\" style=\"\" data-dxb-id=\"gb4ndljwa7\" data-dxb-pid=\"gbv5y3im9n\" id=\"gbv5y3im9n\" data-dxb=\"dxb_column\" data-dxb-width=\" 1/2\" data-dxb-cnt=\"true\"></div></div></div></div><script src=\"-base-url-/-module-directory-/dxpr_builder/dxpr_frontend.min.js\"></script>\n<script src=\"-base-url-/-module-directory-_e/dxpr_builder_e/dxpr_frontend_e.min.js\"></script>\n"
