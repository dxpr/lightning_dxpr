      value: "<div class=\"dxb-element dxb-section\" style=\"\" data-dxb-id=\"gb7jbwro0x\" data-dxb-pid=\"gbrsrsftha\" id=\"gbrsrsftha\" data-dxb=\"dxb_section\"><div class=\"dxb-ctnr container\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gbtl4ux07l\" data-dxb-pid=\"gbx7hioi3z\" id=\"gbx7hioi3z\" data-dxb=\"dxb_text\" data-dxb-cnt=\"true\"><h2>The below Views display should list the most recently added users on this website and also include the Title of the block.</h2></div></div></div><div class=\"dxb-element dxb-section\" style=\"\" data-dxb-id=\"gbwrt0d83z\" data-dxb-pid=\"gb05lqezu3\" id=\"gb05lqezu3\" data-dxb=\"dxb_section\"><div class=\"dxb-ctnr container\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-cms-element\" style=\"\" data-dxb-id=\"gbsrgk5ksk\" data-dxb-pid=\"gb6ea4ysjh\" id=\"gb6ea4ysjh\" data-dxb=\"dxb_view-who_s_new-block_1\" data-dxb-display_title=\"yes\" data-dxb-override_pager=\"no\" data-dxb-items=\"\" data-dxb-offset=\"\"></div></div></div><div class=\"dxb-element dxb-section\" style=\"\" data-dxb-id=\"gbbtrddtoq\" data-dxb-pid=\"gb87a88nyl\" id=\"gb87a88nyl\" data-dxb=\"dxb_section\"><div class=\"dxb-ctnr container\" data-dxb-cnt=\"true\"><hr class=\"dxb-element dxb-separator\" style=\"border: none;\" data-dxb-id=\"gb34n7ja0p\" data-dxb-pid=\"gbf8efgj6l\" id=\"gbf8efgj6l\" data-dxb=\"dxb_separator\"><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gbuvhue10l\" data-dxb-pid=\"gbkny0j3mm\" id=\"gbkny0j3mm\" data-dxb=\"dxb_text\" data-dxb-cnt=\"true\"><h2>The below Views display should list Drupal's log messages</h2></div><div class=\"dxb-element dxb-cms-element\" style=\"\" data-dxb-id=\"gb7ydvlxxn\" data-dxb-pid=\"gbrrvwz7p7\" id=\"gbrrvwz7p7\" data-dxb=\"dxb_view-watchdog-page\" data-dxb-override_pager=\"no\" data-dxb-items=\"\" data-dxb-offset=\"\" data-dxb-toggle_fields=\"nothing,wid,severity,type,timestamp,message,name,link\"></div></div></div><div class=\"dxb-element dxb-section\" style=\"\" data-dxb-id=\"gbnzx5lyik\" data-dxb-pid=\"gbaa7habf1\" id=\"gbaa7habf1\" data-dxb=\"dxb_section\"><div class=\"dxb-ctnr container\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gbccge6qt8\" data-dxb-pid=\"gb7rhcqc8e\" id=\"gb7rhcqc8e\" data-dxb=\"dxb_text\" data-dxb-cnt=\"true\"><h2>The below Views display should list Drupal's log messages, and limit it to show only 5 messages</h2></div><div class=\"dxb-element dxb-cms-element\" style=\"\" data-dxb-id=\"gbfymwlkmr\" data-dxb-pid=\"gbgwr5pflu\" id=\"gbgwr5pflu\" data-dxb=\"dxb_view-watchdog-page\" data-dxb-override_pager=\"yes\" data-dxb-items=\"5\" data-dxb-offset=\"\" data-dxb-toggle_fields=\"nothing,wid,severity,type,timestamp,message,name,link\"></div></div></div><div class=\"dxb-element dxb-section\" style=\"\" data-dxb-id=\"gbj7jlbrmy\" data-dxb-pid=\"gb1byoyqks\" id=\"gb1byoyqks\" data-dxb=\"dxb_section\"><div class=\"dxb-ctnr container\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gbfxozjy6x\" data-dxb-pid=\"gbs8zddklk\" id=\"gbs8zddklk\" data-dxb=\"dxb_text\" data-dxb-cnt=\"true\"><h2>The below Views display should list Drupal's log messages, and limit it to show only 5 messages of the \"type\" <em>System.</em></h2><p><em>@todo this block should also have a warning message that Ajax needs to be enabled to use the filter.</em></p></div><div class=\"dxb-element dxb-cms-element\" style=\"\" data-dxb-id=\"gbp62y2hyd\" data-dxb-pid=\"gbv8twz0qm\" id=\"gbv8twz0qm\" data-dxb=\"dxb_view-watchdog-page\" data-dxb-settings=\"type%5B%5D=system\" data-dxb-override_pager=\"yes\" data-dxb-items=\"5\" data-dxb-offset=\"\" data-dxb-toggle_fields=\"nothing,wid,severity,type,timestamp,message,name,link\"></div></div></div><div class=\"dxb-element dxb-section\" style=\"\" data-dxb-id=\"gbms9mvb6o\" data-dxb-pid=\"gbcgjh3tp6\" id=\"gbcgjh3tp6\" data-dxb=\"dxb_section\"><div class=\"dxb-ctnr container\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gbipyrtxvc\" data-dxb-pid=\"gb00nzohp3\" id=\"gb00nzohp3\" data-dxb=\"dxb_text\" data-dxb-cnt=\"true\"><h2>The below Views display should list Drupal's log messages, and because the option \"Show exposed filters\" is enabled, it should display a warning in red that the Ajax option needs to be switched on for this Views display</h2></div><div class=\"dxb-element dxb-cms-element\" style=\"\" data-dxb-id=\"gb6t8hblcw\" data-dxb-pid=\"gbvengyuhb\" id=\"gbvengyuhb\" data-dxb=\"dxb_view-watchdog-page\" data-dxb-display_exposed_filters=\"yes\" data-dxb-override_pager=\"yes\" data-dxb-items=\"5\" data-dxb-offset=\"\" data-dxb-toggle_fields=\"nothing,wid,severity,type,timestamp,message,name,link\"></div></div></div><div class=\"dxb-element dxb-section\" style=\"\" data-dxb-id=\"gb2vbsr53d\" data-dxb-pid=\"gb2k0hbg40\" id=\"gb2k0hbg40\" data-dxb=\"dxb_section\"><div class=\"dxb-ctnr container\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gb504cqv4r\" data-dxb-pid=\"gb504cqv4r\" id=\"gb504cqv4r\" data-dxb=\"dxb_text\" data-dxb-cnt=\"true\"><h2>A views exposed form will only work for both anonymous users and editors if it has Ajax enabled.</h2></div><div class=\"dxb-element dxb-cms-element\" style=\"\" data-dxb-id=\"gb2r77cpm8\" data-dxb-pid=\"gb2r77cpm8\" id=\"gb2r77cpm8\" data-dxb=\"dxb_view-qa_views-exposed_filter\" data-dxb-settings=\"Search=\" data-dxb-display_exposed_filters=\"yes\" data-dxb-display_title=\"yes\" data-dxb-override_pager=\"no\" data-dxb-items=\"\" data-dxb-offset=\"\"></div></div></div><div class=\"dxb-element dxb-section\" style=\"\" data-dxb-id=\"gbklmiri0c\" data-dxb-pid=\"gbxrrljv7p\" id=\"gbxrrljv7p\" data-dxb=\"dxb_section\"><div class=\"dxb-ctnr container\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gbzimj25uw\" data-dxb-pid=\"gb0voqil3d\" id=\"gb0voqil3d\" data-dxb=\"dxb_text\" data-dxb-cnt=\"true\"><h2>On the right-hand side is a block that has \"Pager offset\" set to 4. This means the first item in this Views display should be the same as the last item in the Views display on the left-hand side.</h2></div><div class=\"dxb-element dxb-row row dxb-row--sm\" style=\"\" data-dxb-id=\"gbwvm3p4rh\" data-dxb-pid=\"gbk9sl3rey\" id=\"gbk9sl3rey\" data-dxb=\"dxb_row\" data-dxb-device=\"sm\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-ctnr dxb-column col-sm-6\" style=\"\" data-dxb-id=\"gbwa0d0k1y\" data-dxb-pid=\"gbricgqtk0\" id=\"gbricgqtk0\" data-dxb=\"dxb_column\" data-dxb-width=\"1/2\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-cms-element\" style=\"\" data-dxb-id=\"gbpl2eqalr\" data-dxb-pid=\"gb9c89t5m9\" id=\"gb9c89t5m9\" data-dxb=\"dxb_view-watchdog-page\" data-dxb-override_pager=\"yes\" data-dxb-items=\"5\" data-dxb-offset=\"\" data-dxb-toggle_fields=\"nothing,wid,severity,type,timestamp,message,name,link\"></div></div><div class=\"dxb-element dxb-ctnr dxb-column col-sm-6\" style=\"\" data-dxb-id=\"gbnzmh5md9\" data-dxb-pid=\"gb63o8spbw\" id=\"gb63o8spbw\" data-dxb=\"dxb_column\" data-dxb-width=\" 1/2\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-cms-element\" style=\"\" data-dxb-id=\"gb2z1og8b1\" data-dxb-pid=\"gbq5je8jek\" id=\"gbq5je8jek\" data-dxb=\"dxb_view-watchdog-page\" data-dxb-override_pager=\"yes\" data-dxb-items=\"5\" data-dxb-offset=\"4\" data-dxb-toggle_fields=\"nothing,wid,severity,type,timestamp,message,name,link\"></div></div></div></div></div><div class=\"dxb-element dxb-section\" style=\"\" data-dxb-id=\"gb1nn57lrd\" data-dxb-pid=\"gbqyh8hbnl\" id=\"gbqyh8hbnl\" data-dxb=\"dxb_section\"><div class=\"dxb-ctnr container\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gbec2r61f8\" data-dxb-pid=\"gb2qj350h8\" id=\"gb2qj350h8\" data-dxb=\"dxb_text\" data-dxb-cnt=\"true\"><h2>The below view demonstrates support for Views'&nbsp;<em>Contextual Filter</em>&nbsp;feature by displaying the Node title of this page.</h2></div><div class=\"dxb-element dxb-cms-element\" style=\"\" data-dxb-id=\"gbiuxkgt5c\" data-dxb-pid=\"gbo4k1fn96\" id=\"gbo4k1fn96\" data-dxb=\"dxb_view-qa_views-title_view\" data-dxb-override_pager=\"no\" data-dxb-items=\"\" data-dxb-offset=\"\" data-dxb-contextual_filter=\"\"></div></div></div><div class=\"dxb-element dxb-section\" style=\"\" data-dxb-id=\"gbgx9mpe1m\" data-dxb-pid=\"gbsq333wk1\" id=\"gbsq333wk1\" data-dxb=\"dxb_section\"><div class=\"dxb-ctnr container\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gb3zfzg9gk\" data-dxb-pid=\"gbeqbli95n\" id=\"gbeqbli95n\" data-dxb=\"dxb_text\" data-dxb-cnt=\"true\"><h2>Below we demonstrate that we can override the Contextual Filter value in the front-end with DXPR Builder. The below Views display should show the title of the Node with Node ID <em>10.</em></h2></div><div class=\"dxb-element dxb-cms-element\" style=\"\" data-dxb-id=\"gb7scsmu3m\" data-dxb-pid=\"gb46e0z5wy\" id=\"gb46e0z5wy\" data-dxb=\"dxb_view-qa_views-title_view\" data-dxb-override_pager=\"no\" data-dxb-items=\"\" data-dxb-offset=\"\" data-dxb-contextual_filter=\"10\"></div></div></div><script src=\"-base-url-/-module-directory-/dxpr_builder/dxpr_frontend.min.js\"></script>\n"
