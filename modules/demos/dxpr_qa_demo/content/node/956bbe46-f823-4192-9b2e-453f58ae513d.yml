      value: "<div class=\"dxb-element dxb-section\" style=\"\" data-dxb-editor-libraries=\"\" data-dxb-id=\"gbd1v8bdwy\" data-dxb-pid=\"gb4j3yeetu\" id=\"gb4j3yeetu\" data-dxb=\"dxb_section\"><div class=\"dxb-ctnr container\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-row row dxb-row--sm\" style=\"\" data-dxb-id=\"gb15zuchzs\" data-dxb-pid=\"gbdmhyk6dx\" id=\"gbdmhyk6dx\" data-dxb=\"dxb_row\" data-dxb-device=\"sm\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-ctnr dxb-column col-sm-6\" style=\"\" data-dxb-id=\"gbje47iv3p\" data-dxb-pid=\"gbv29eyzae\" id=\"gbv29eyzae\" data-dxb=\"dxb_column\" data-dxb-width=\"1/2\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gbkjtvpm5y\" data-dxb-pid=\"gbe4kw5njr\" id=\"gbe4kw5njr\" data-dxb=\"dxb_text\" data-dxb-cnt=\"true\"><h2>Test Local Video.</h2><ol><li>Check that the DXPR Builder Enterprise module is installed</li><li>In the adjacent column click the + icon</li><li>From the Content tab select the \"Local Video\" element</li><li>Click the Select Video button</li><li>Select a video from your local storage</li><li>Upload the video</li><li>Test that it shows and plays in the browser</li></ol><p><br></p></div></div><div class=\"dxb-element dxb-ctnr dxb-column col-sm-6\" style=\"\" data-dxb-id=\"gba9ysussd\" data-dxb-pid=\"gbgxrs2nya\" id=\"gbgxrs2nya\" data-dxb=\"dxb_column\" data-dxb-width=\" 1/2\" data-dxb-cnt=\"true\"></div></div></div></div><script src=\"-base-url-/-module-directory-/dxpr_builder/dxpr_frontend.min.js\"></script>\n<script src=\"-base-url-/-module-directory-_e/dxpr_builder_e/dxpr_frontend_e.min.js\"></script>\n"
