id=\"gb2hzswvst\" data-dxb-pid=\"gbf2pns0v5\" id=\"gbf2pns0v5\" data-dxb=\"dxb_text\" data-dxb-human-readable=\"Text\" data-dxb-human-readable-en=\"Text\" data-dxb-cnt=\"true\"><p>Tabs are used to group related content into small, more digestable chunks. Tabs are naturally understood by people because they look like tabs that are used to group paper documents. This makes tabs the most user-friendly space-saving layout element across all user groups, including older audiences.<\/p><\/div><\/div><\/div><\/div><div class=\"dxb-element dxb-ctnr dxb-tab tab-pane\" style=\"\" data-dxb-id=\"gbkmhtzfpn\" data-dxb-pid=\"gb8fiyb85d\" id=\"gb8fiyb85d\" data-dxb=\"dxb_tab\" data-dxb-human-readable=\"Tab\" data-dxb-human-readable-en=\"Tab\" data-dxb-title=\"Tab Topic 2\"><div class=\"panel-heading\"><h4 class=\"panel-title\"><a data-toggle=\"collapse\" data-parent=\"#panel-group-gb0mwn4oaf\" href=\"#tab-gb8fiyb85d\" role=\"button\"> Tab Topic 2 <\/a><\/h4><\/div><!-- The \"tab-\" prefix is to make it unique since this id is the tab element id. --><div id=\"tab-gb8fiyb85d\" role=\"tabpanel\" style=\"height: auto;\"><div class=\"panel-body\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-icon\" style=\"\" data-dxb-editor-libraries=\"icon_helpers font_awesome_5_free\" data-dxb-id=\"gbczbsbkkf\" data-dxb-pid=\"gbp949vkqq\" id=\"gbp949vkqq\" data-dxb=\"dxb_icon\" data-dxb-human-readable=\"Icon\" data-dxb-human-readable-en=\"Icon\" data-dxb-icon=\"fas fa-tv\" data-dxb-size=\"fa-3x\" data-dxb-style=\"margin-top:5px;margin-bottom:5px;\"><i class=\"dxb-icon-content fas fa-tv fa-3x\" style=\"margin-top:5px;margin-bottom:5px;\"><\/i><\/div><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gbfvb2syvo\" data-dxb-pid=\"gb94kyb213\" id=\"gb94kyb213\" data-dxb=\"dxb_text\" data-dxb-human-readable=\"Text\" data-dxb-human-readable-en=\"Text\" data-dxb-cnt=\"true\"><p>Tabs are used to group related content into small, more digestable chunks. Tabs are naturally understood by people because they look like tabs that are used to group paper documents. This makes tabs the most user-friendly space-saving layout element across all user groups, including older audiences.<\/p><\/div><\/div><\/div><\/div><div class=\"dxb-element dxb-ctnr dxb-tab tab-pane\" style=\"\" data-dxb-id=\"gba04joviv\" data-dxb-pid=\"gb2jqdgppb\" id=\"gb2jqdgppb\" data-dxb=\"dxb_tab\" data-dxb-human-readable=\"Tab\" data-dxb-human-readable-en=\"Tab\" data-dxb-title=\"Tab Topic 3\"><div class=\"panel-heading\"><h4 class=\"panel-title\"><a data-toggle=\"collapse\" data-parent=\"#panel-group-gb0mwn4oaf\" href=\"#tab-gb2jqdgppb\" role=\"button\"> Tab Topic 3 <\/a><\/h4><\/div><!-- The \"tab-\" prefix is to make it unique since this id is the tab element id. --><div id=\"tab-gb2jqdgppb\" role=\"tabpanel\" style=\"height: auto;\"><div class=\"panel-body\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-icon\" style=\"\" data-dxb-editor-libraries=\"icon_helpers font_awesome_5_free\" data-dxb-id=\"gb1f3lsi8o\" data-dxb-pid=\"gb2ot00b43\" id=\"gb2ot00b43\" data-dxb=\"dxb_icon\" data-dxb-human-readable=\"Icon\" data-dxb-human-readable-en=\"Icon\" data-dxb-icon=\"fas fa-mobile-alt\" data-dxb-size=\"fa-3x\" data-dxb-style=\"margin-top:5px;margin-bottom:5px;\"><i class=\"dxb-icon-content fas fa-mobile-alt fa-3x\" style=\"margin-top:5px;margin-bottom:5px;\"><\/i><\/div><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gbpthvm6x2\" data-dxb-pid=\"gbpov2d0n0\" id=\"gbpov2d0n0\" data-dxb=\"dxb_text\" data-dxb-human-readable=\"Text\" data-dxb-human-readable-en=\"Text\" data-dxb-cnt=\"true\"><p>Tabs are used to group related content into small, more digestable chunks. Tabs are naturally understood by people because they look like tabs that are used to group paper documents. This makes tabs the most user-friendly space-saving layout element across all user groups, including older audiences.<\/p><\/div><\/div><\/div><\/div><\/div><\/div><div class=\"dxb-element dxb-text\" style=\"\" da