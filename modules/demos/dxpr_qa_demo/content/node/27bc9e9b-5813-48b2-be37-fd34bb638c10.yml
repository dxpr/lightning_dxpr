en=\"Toggle\" data-dxb-title=\"What are collapsibles?\"><div class=\"panel-heading\"><h4 class=\"panel-title\"><a data-toggle=\"collapse\" data-parent=\"#gbm57f0t93\" href=\"#gb7c4xzetn-collapse\" role=\"button\" class=\"\" aria-expanded=\"true\"> What are collapsibles? <\/a><\/h4><\/div><div id=\"gb7c4xzetn-collapse\" class=\"panel-collapse collapse in\" role=\"tabpanel\" aria-expanded=\"true\" style=\"\"><div class=\"panel-body dxb-ctnr\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gbfznkz2sm\" data-dxb-pid=\"gblx0zjmcr\" id=\"gblx0zjmcr\" data-dxb=\"dxb_text\" data-dxb-human-readable=\"Text\" data-dxb-human-readable-en=\"Text\" data-dxb-cnt=\"true\"><p>Collapsibles are layout elements that let you hide content and progressively disclose it. This design pattern is often used for&nbsp;<em>Frequently Asked Questions. <\/em>A user will see a list of questions and only when clicking a question, the collapsible element unfolds to show the answer.<\/p><\/div><\/div><\/div><\/div><div class=\"dxb-element dxb-toggle panel panel-default\" style=\"\" data-dxb-id=\"gbzw7aefw8\" data-dxb-pid=\"gbvsvl3xre\" id=\"gbvsvl3xre\" data-dxb=\"dxb_toggle\" data-dxb-human-readable=\"Toggle\" data-dxb-human-readable-en=\"Toggle\" data-dxb-title=\"What are collapsibles?\"><div class=\"panel-heading\"><h4 class=\"panel-title\"><a data-toggle=\"collapse\" data-parent=\"#gbm57f0t93\" href=\"#gbvsvl3xre-collapse\" role=\"button\" class=\"collapsed\" aria-expanded=\"false\"> What are collapsibles? <\/a><\/h4><\/div><div id=\"gbvsvl3xre-collapse\" class=\"panel-collapse collapse\" role=\"tabpanel\" aria-expanded=\"false\"><div class=\"panel-body dxb-ctnr\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gb26g8hl42\" data-dxb-pid=\"gbo7xxslkt\" id=\"gbo7xxslkt\" data-dxb=\"dxb_text\" data-dxb-human-readable=\"Text\" data-dxb-human-readable-en=\"Text\" data-dxb-cnt=\"true\"><p>Collapsibles are layout elements that let you hide content and progressively disclose it. This design pattern is often used for&nbsp;<em>Frequently Asked Questions. <\/em>A user will see a list of questions and only when clicking a question, the collapsible element unfolds to show the answer.<\/p><\/div><\/div><\/div><\/div><div class=\"dxb-element dxb-toggle panel panel-default\" style=\"\" data-dxb-id=\"gbs4a1bwg2\" data-dxb-pid=\"gbtyq4b2yz\" id=\"gbtyq4b2yz\" data-dxb=\"dxb_toggle\" data-dxb-human-readable=\"Toggle\" data-dxb-human-readable-en=\"Toggle\" data-dxb-title=\"What are collapsibles?\"><div class=\"panel-heading\"><h4 class=\"panel-title\"><a data-toggle=\"collapse\" data-parent=\"#gbm57f0t93\" href=\"#gbtyq4b2yz-collapse\" role=\"button\" class=\"collapsed\" aria-expanded=\"false\"> What are collapsibles? <\/a><\/h4><\/div><div id=\"gbtyq4b2yz-collapse\" class=\"panel-collapse collapse\" role=\"tabpanel\" aria-expanded=\"false\"><div class=\"panel-body dxb-ctnr\" data-dxb-cnt=\"true\"><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gbay4h3map\" data-dxb-pid=\"gb1ez8e45k\" id=\"gb1ez8e45k\" data-dxb=\"dxb_text\" data-dxb-human-readable=\"Text\" data-dxb-human-readable-en=\"Text\" data-dxb-cnt=\"true\"><p>Collapsibles are layout elements that let you hide content and progressively disclose it. This design pattern is often used for&nbsp;<em>Frequently Asked Questions. <\/em>A user will see a list of questions and only when clicking a question, the collapsible element unfolds to show the answer.<\/p><p><br><\/p><\/div><\/div><\/div><\/div><\/div><div class=\"dxb-element dxb-text\" style=\"\" data-dxb-id=\"gbfqqkwcdy\" data-dxb-pid=\"gb7l9p5xt6\" id=\"gb7l9p5xt6\" data-dxb=\"dxb_text\" data-dxb-human-readable=\"Text\" data-dxb-human-readable-en=\"Text\" data-dxb-cnt=\"true\"><h2>Saving space with tabs<\/h2><\/div><div class=\"dxb-element dxb-tabs tabbable dxb-tabs-responsive tabs-top\" style=\"margin-bottom: 90px; display: block;\" data-dxb-id=\"gbwghnrpk1\" data-dxb-pid=\"gb0mwn4oaf\" id